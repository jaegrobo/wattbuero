<!--
  ANLEITUNG ZUM DUPLIZIEREN (siehe auch README.md):
  1. Diese Datei kopieren, z.B. auf GitHub.com im Repo-Ordner "posts/" auf "Add file" -> "Create new file"
     klicken, den Inhalt dieser Datei hineinkopieren, Dateiname vergeben (z.B. posts/ausruestung-zweiter-test.html).
  2. Alle [Platzhalter]-Texte unten ersetzen.
  3. Titel/Meta-Description im <head> anpassen.
  4. Die zutreffende Kategorie-Übersichtsseite (ausruestung.html / training.html / strecken.html)
     ebenfalls öffnen und dort im card-grid eine neue <a class="card">-Karte mit Link auf den neuen Post ergänzen.
  5. Commit -> Netlify baut die Seite automatisch neu (dauert ca. 1 Minute).

  NUR BEI KATEGORIE = TRAINING zusätzlich:
  - <body> zu <body data-root=".."> ändern (steht unten schon so, nicht nochmal ändern nötig)
  - direkt nach der post-meta-Zeile den Block <div id="wattbuero-mini-stats">Lade Trainingsdaten…</div>
    einfügen (steht unten schon drin) - zeigt automatisch die aktuellen 28-Tage-Werte aus Strava.
  - vor </body> steht schon <script src="../scripts/stats-widget.js"></script> - nicht entfernen.
  Bei Ausrüstung/Strecken-Posts beide Zeilen (Mini-Stats-Div + Script) wieder löschen, die gehören
  nur zu Training-Posts.

  Diesen Kommentarblock beim fertigen Post entfernen oder drin lassen, er wird nicht sichtbar angezeigt.
-->

      <a href="../strecken.html">Strecken</a>
      <a href="../ueber.html">Über</a>
    </nav>
  </div>
</header>

<main>
  <article class="post">
    <h1>[Platzhalter-Titel]</h1>
    <p class="post-meta">Kategorie: [Ausrüstung/Training/Strecken] · [Datum]</p>

    <!-- Nur bei Kategorie Training drin lassen, sonst löschen: -->
    <div id="wattbuero-mini-stats">Lade Trainingsdaten…</div>

    <p>[Platzhalter-Text]</p>

      Werbung / Affiliate-Link: [Platzhalter]
    </div>
  </article>
</main>

<footer class="site-footer">
  &copy; 2026 Wattbüro · <a href="../ueber.html">Über diese Seite</a>
</footer>

</html>

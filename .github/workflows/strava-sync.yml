name: Strava Sync

"on":
  schedule:
    # jeden Montag 06:00 UTC = 07:00/08:00 Uhr deutscher Zeit, je nach Sommerzeit
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  # ^ erlaubt manuelles Auslösen über den "Run workflow"-Button im Actions-Tab,
  #   zum Testen ohne eine Woche zu warten.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Strava data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 scripts/strava_sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "wattbuero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/strava-stats.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Strava-Daten."
            exit 0
          fi
          git commit -m "Automatischer Strava-Sync $(date -u +%Y-%m-%d)"
          # Zwischen Checkout und Push kann main durch einen normalen Push
          # (z. B. manuelles Merge einer Website-Änderung) weitergewandert
          # sein - dann lehnt GitHub den Push als Non-Fast-Forward ab.
          # data/strava-stats.json wird ausschließlich von diesem Bot
          # geschrieben, ein Rebase-Konflikt ist daher praktisch
          # ausgeschlossen. Vor dem Push einmal nachziehen, das behebt es.
          git pull --rebase origin main
          git push
